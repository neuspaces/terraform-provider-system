version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    target-branch: development
    commit-message:
      prefix: "chore(deps)"
    groups:
      hashicorp:
        patterns:
          - "github.com/hashicorp/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: development
    commit-message:
      prefix: "ci(deps)"
