name: build-alpine-test-container

on:
  push:
    # Push events on main and development branches
    branches:
      - main
      - development
    # Changes inside test/alpine
    paths:
      - '.github/workflows/build-alpine-test-container.yml'
      - 'test/alpine/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_BUILD_CONTEXT: ./test/alpine/docker

jobs:
  default:
    name: Build/push image
    if: github.repository == 'Dorokhovich-COM/terraform-provider-system'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - # The image name must be lowercase; github.repository contains uppercase characters
        # and would produce an invalid docker tag.
        # ghcr.io/dorokhovich-com/terraform-provider-system/alpine-acctest
        name: Context variables
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}/alpine-acctest" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ env.IMAGE_BUILD_CONTEXT }}
          file: ${{ env.IMAGE_BUILD_CONTEXT }}/Dockerfile
          tags: |
            ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.short_sha }}
