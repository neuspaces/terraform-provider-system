name: main

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'NOTICE'
      - 'CHANGELOG.md'
      - 'docs/superpowers/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  # Never cancel a tag run: the release job must complete
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check Go format
        run: |
          gofmtout=$(gofmt -l .); [ -z "${gofmtout}" ] || { echo "Detected malformatted go files. Run 'gofmt -w .'" >&2; echo "${gofmtout}"; exit 1; }

      - name: Get dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      # The runner has no ~/.terraformrc, so tfplugindocs builds the provider into a clean
      # plugin cache. Locally, a shared `plugin_cache_dir` makes the result depend on which
      # checkout was built last; run `go generate` with `TF_CLI_CONFIG_FILE=$(mktemp)` there.
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

      # Checks the frontmatter and the structure of docs/** against what the Terraform
      # Registry accepts; `go generate` alone does not catch a rejected document.
      - name: Validate provider documentation
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs validate --provider-name terraform-provider-system

      - name: Build
        run: go build -v .

      - name: Run unit tests
        run: go test -v ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Fails on vulnerabilities which are reachable from this module. Vulnerabilities in
      # imported packages and required modules which the provider does not call are printed
      # by `-show=verbose` and do not fail the job.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show=verbose ./...

  acctest:
    name: Acceptance test (${{ matrix.target.name }}, ${{ matrix.cli.tool }} ${{ matrix.cli.version }})

    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: alpine
            test_path: test/alpine
            host_port: 10022
            private_key_file: root-ed25519
            extra_run_args: --tmpfs /tmp --tmpfs /run -v /sys/fs/cgroup:/sys/fs/cgroup:ro
          - name: debian
            test_path: test/debian
            host_port: 11022
            private_key_file: root-ed25519
            extra_run_args: --tmpfs /tmp --tmpfs /run --tmpfs /run/lock --mount type=bind,source=/sys/fs/cgroup,target=/sys/fs/cgroup --cgroupns=host
          - name: fedora
            test_path: test/fedora
            host_port: 12022
            private_key_file: root-ed25519
            extra_run_args: --tmpfs /tmp --tmpfs /run --tmpfs /run/lock --mount type=bind,source=/sys/fs/cgroup,target=/sys/fs/cgroup --cgroupns=host
        cli:
          # minimum supported Terraform version
          - tool: terraform
            version: "1.6.6"
          # last Terraform line without write-only attributes
          - tool: terraform
            version: "1.10.5"
          # first Terraform line with write-only attributes
          - tool: terraform
            version: "1.11.4"
          # last Terraform line before the current one
          - tool: terraform
            version: "1.14.9"
          # current Terraform line
          - tool: terraform
            version: "1.17.1"
          # first OpenTofu release of the 1.6 line
          - tool: tofu
            version: "1.6.0"
          # current OpenTofu line
          - tool: tofu
            version: "1.13.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Context variables
        id: vars
        run: |
          echo "os_container_name=terraform-provider-system-${{ matrix.target.name }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The test container image is built in the job. The images published by
      # upstream (ghcr.io/neuspaces/terraform-provider-system/*-acctest) are not
      # accessible from this repository.
      - name: Build ${{ matrix.target.name }} test container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.test_path }}/docker
          file: ${{ matrix.target.test_path }}/docker/Dockerfile
          push: false
          load: true
          tags: terraform-provider-system-${{ matrix.target.name }}:ci
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

      - # Note: services cannot be used for the purpose of running the test os container because, required files from the repository checkout are not available at the time the service containers are started
        name: Start ${{ matrix.target.name }} container
        id: start_os_container
        run: >
          sudo chown root:root ${{ github.workspace }}/${{ matrix.target.test_path }}/${{ matrix.target.private_key_file }}.pub;
          sudo chmod 600 ${{ matrix.target.test_path }}/${{ matrix.target.private_key_file }} ${{ matrix.target.test_path }}/${{ matrix.target.private_key_file }}.pub;
          docker run
          --detach
          --rm
          --name '${{ steps.vars.outputs.os_container_name }}'
          --env 'SSH_ENABLE_ROOT_PASSWORD_AUTH=true'
          --env 'SSH_ENABLE_PASSWORD_AUTH=true'
          --env 'TCP_FORWARDING=true'
          --publish ${{ matrix.target.host_port }}:22
          --mount type=bind,source=${{ github.workspace }}/${{ matrix.target.test_path }}/${{ matrix.target.private_key_file }}.pub,target=/etc/authorized_keys/root,readonly
          --mount type=bind,source=${{ github.workspace }}/${{ matrix.target.test_path }}/hostkeys,target=/etc/ssh/keys
          ${{ matrix.target.extra_run_args }}
          terraform-provider-system-${{ matrix.target.name }}:ci

      - name: Setup Terraform
        if: matrix.cli.tool == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.cli.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.cli.tool == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.cli.version }}
          tofu_wrapper: false

      # TF_ACC_PROVIDER_HOST must match the registry host of the CLI under test. The
      # SDKv2 helper/resource builds the reattach provider address from it; with the
      # Terraform default OpenTofu does not find the provider.
      - name: Resolve CLI path
        id: cli
        run: |
          echo "path=$(command -v '${{ matrix.cli.tool }}')" >> "$GITHUB_OUTPUT"
          if [ '${{ matrix.cli.tool }}' = 'tofu' ]; then
            echo "provider_host=registry.opentofu.org" >> "$GITHUB_OUTPUT"
          else
            echo "provider_host=registry.terraform.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          TF_LOG: "DEBUG"
          TF_ACC_TERRAFORM_PATH: ${{ steps.cli.outputs.path }}
          TF_ACC_PROVIDER_HOST: ${{ steps.cli.outputs.provider_host }}
          TF_ACC_PROVIDER_SYSTEM_TARGETS: ${{ matrix.target.name }}
        run: go test -count=1 -timeout 25m -v ./internal/provider/

      - name: Logs of ${{ matrix.target.name }} container
        if: ${{ always() && steps.start_os_container.outcome == 'success' }}
        continue-on-error: true
        run: docker logs '${{ steps.vars.outputs.os_container_name }}'

      - name: Stop ${{ matrix.target.name }} container
        if: ${{ always() && steps.start_os_container.outcome == 'success' }}
        continue-on-error: true
        run: docker stop --time 30 '${{ steps.vars.outputs.os_container_name }}'

  release:
    name: Release

    # only on push events and if commit has version tag
    if: ${{ github.repository == 'Dorokhovich-COM/terraform-provider-system' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    needs: [acctest, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Import GPG private key
        id: import_gpg_private_key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg_private_key.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
